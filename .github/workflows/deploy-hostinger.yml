# Déploiement automatique du site sur Hostinger par FTP.
# Identifiants à renseigner dans GitHub : Settings → Secrets and variables → Actions
#   Secrets   : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variable  : FTP_SERVER_DIR (facultatif, par défaut /public_html/)
name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Envoyer les fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          # Ne jamais écraser les demandes de rendez-vous enregistrées sur le serveur.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            storage/rendezvous.json
