<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&display=swap');

  :root{
    --pine:#16241D;
    --ivory:#F6F1E3;
    --red:#C4402F;
    --sage:#6E9481;
    --sage-light:#A9C2B0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:transparent;}
  body{width:1063px;height:1063px;font-family:'Inter Tight',system-ui,sans-serif;}

  .disc{
    position:relative;
    width:1063px;height:1063px;
    border-radius:50%;
    overflow:hidden;
    background:var(--pine) center/cover no-repeat;
  }
  .disc img.bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:.9;
  }
  .disc::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 38%, rgba(22,36,29,0) 0%, rgba(22,36,29,.35) 62%, rgba(22,36,29,.72) 100%);
  }
  .ring{
    position:absolute; inset:34px;
    border-radius:50%;
    border:2px solid rgba(169,194,176,.55);
    z-index:3;
    pointer-events:none;
  }

  .content{
    position:absolute; inset:0;
    z-index:4;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
  }
  .mark{ width:300px; height:300px; margin-bottom:8px; filter:drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
  .word{
    font-weight:900;
    font-size:98px;
    letter-spacing:1px;
    color:var(--ivory);
    line-height:1;
    margin-top:6px;
  }
  .rule{
    width:110px; height:3px; background:var(--red);
    margin:26px 0 22px;
    border-radius:2px;
  }
  .tag{
    font-weight:700;
    font-size:34px;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--sage-light);
  }
</style>
</head>
<body>
  <div class="disc" id="disc">
    <img class="bg" src="bg-dark.jpg" alt="">
    <div class="ring"></div>
    <div class="content">
      <img class="mark" src="../logo-mark-light.svg" alt="">
      <div class="word">BACNIFIQUE</div>
      <div class="rule"></div>
      <div class="tag">Nettoyage&nbsp;de&nbsp;poubelles</div>
    </div>
  </div>
</body>
</html>
