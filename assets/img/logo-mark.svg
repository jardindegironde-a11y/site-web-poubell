<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">BACNIFIQUE</title>
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24382E"/>
      <stop offset="100%" stop-color="#16241D"/>
    </linearGradient>
  </defs>

  <!-- badge background -->
  <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#badgeGrad)"/>

  <!-- knot / cycle mark: two interlocking loops standing for collecte -> nettoyage -> retour -->
  <g fill="none" stroke-linecap="round">
    <path d="M60 34 C40 34 30 46 30 58 C30 72 42 80 54 80 C68 80 78 68 78 56 C78 46 70 40 62 40 C54 40 48 46 48 54 C48 62 54 68 62 68"
          stroke="#F6F1E3" stroke-width="8"/>
    <path d="M60 34 C40 34 30 46 30 58 C30 72 42 80 54 80 C68 80 78 68 78 56 C78 46 70 40 62 40 C54 40 48 46 48 54 C48 62 54 68 62 68"
          stroke="#16241D" stroke-width="8" stroke-dasharray="0 40 26 200"/>
  </g>

  <!-- single red accent -->
  <circle cx="62" cy="68" r="6.5" fill="#C4402F"/>
</svg>
